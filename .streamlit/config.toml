# One palette for the whole demo — the sign-in screen *and* everything behind it.
#
# Tokens: ink `#131313` on paper `#FFFFFF`, a neutral grey `#F4F4F4` for surfaces, the `#E4E7E5`
# hairline, and one brand green `#02D169` — sampled straight out of the Aspire logo by
# `scripts/make_brand_assets.py`. That single value is the logo's green, the primary button's
# green, the send arrow's green and the selected row's green; there is deliberately no lighter
# tint of it, because a large area of pale green stops reading as the same colour the sign-in
# screen uses for a single selected row. Surface is grey, green is action.
#
# Why this file exists at all: the pages behind the sign-in screen used to be stock Streamlit,
# so the app changed design language halfway through. A stylesheet alone cannot fix that —
# radio dots, slider tracks, dataframe borders and the alert palette are painted from theme
# tokens, not from CSS. Everything below that has a token is set *here*; `app.py`'s `_APP_CSS`
# keeps only the handful of things the theme cannot express (the brand typeface, the masthead,
# the avatars, the question bubble, caption colour).
#
# start.py chdirs to the project root before it execs Streamlit, so this file is read on the
# hosted demo too.

[server]
# Serves `./static` at `/app/static/…`, which is where the brand assets and the Jost woff2 live.
# Both are referenced by absolute path from the injected CSS, so they resolve the same way on a
# deployment and on a local run. If this is ever turned off the app still works: the font falls
# back to the system stack.
enableStaticServing = true

[theme]
base = "light"

# --- surfaces and ink -------------------------------------------------------------------
# Ink, not green, for the controls Streamlit paints from this token: radio dots, slider tracks,
# checkboxes, focus rings and the dataframe's own highlight. Green here would have leaked into
# the audit table as a pale green wash over citation cells, which reads as "success" in a log
# that is deliberately neutral. Green is spent on buttons and marks instead — see `_BRAND_CSS`.
primaryColor = "#131313"
backgroundColor = "#FFFFFF"         # paper
secondaryBackgroundColor = "#F4F4F4"   # neutral grey — sidebar, input surfaces, table header
textColor = "#131313"
borderColor = "#E4E7E5"             # the hairline the sign-in list and cards use
linkColor = "#131313"               # links were the stock alert blue; ink matches the design

# --- code and tables --------------------------------------------------------------------
codeBackgroundColor = "#F4F4F4"
codeTextColor = "#131313"
dataframeBorderColor = "#E4E7E5"
dataframeHeaderBackgroundColor = "#F4F4F4"
dataframeHeaderTextColor = "#131313"

# --- shape ------------------------------------------------------------------------------
# The sign-in card is 18px and its Continue button 14px; these are the closest base steps, and
# `_APP_CSS` still rounds the 18px cards explicitly.
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = true             # inputs and buttons carry the hairline, like the list row
showSidebarBorder = true
linkUnderline = true
metricValueFontWeight = 700

# --- alerts -----------------------------------------------------------------------------
# Each kind keeps its meaning but not Streamlit's default saturation. `st.info` was the blue
# the design never uses, so info becomes the grey surface. `st.warning` carries the *refusal*
# template — a correct, complete answer the guard has chosen to withhold — so it stays warm and
# readable rather than turning grey or alarm-red.
blueBackgroundColor = "#F4F4F4"
blueTextColor = "#131313"
blueColor = "#131313"
yellowBackgroundColor = "#FFF7E8"
yellowTextColor = "#131313"
yellowColor = "#8A6100"
redBackgroundColor = "#FDEDED"
redTextColor = "#131313"
redColor = "#A33A3A"
greenBackgroundColor = "#EDFBF1"
greenTextColor = "#131313"
greenColor = "#1F7A45"

